[project]
name = "chillnodecollection"
description = "A collection of enhanced ComfyUI nodes: multi-format image saving with quality control, GPS EXIF metadata and date macros, and FFmpeg-based video combining with GPU encoder auto-detection."
version = "1.0.0"
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
]

dependencies = ["Pillow>=9.0.0", "piexif>=1.1.3", "imageio-ffmpeg>=0.5"]

[project.urls]
Repository = "https://github.com/Megachill/ComfyUI-ChillNodeCollection"
Documentation = "https://github.com/Megachill/ComfyUI-ChillNodeCollection/wiki"
"Bug Tracker" = "https://github.com/Megachill/ComfyUI-ChillNodeCollection/issues"

[tool.comfy]
PublisherId = "megachill"
DisplayName = "Chill Node Collection"
Icon = ""
includes = []
